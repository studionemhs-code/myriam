<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#673ab7" />
    <meta name="description" content="Theotokos — Mãe de Deus. Hub digital da Total Consagração a Jesus por Maria: jornada, formação, calendário mariano e comunidade." />
    <link rel="manifest" href="/manifest.json" />
    <title>Theotokos — Mãe de Deus | Hub da Total Consagração</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theotokos-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
